---
name: archivematica-package-testing

services:

  archivematica:
    image: localhost/archivematica-package-testing_archivematica:latest
    build:
      args:
        DOCKER_IMAGE_NAME: "${DOCKER_IMAGE_NAME:-ubuntu}"
        DOCKER_IMAGE_TAG: "${DOCKER_IMAGE_TAG:-22.04}"
        TARGET: server
    command: /sbin/init
    # The nginx configuration files included in the EL9 RPM specs reference
    # this hostname in their proxy_pass.
    extra_hosts:
      - "localhost4:127.0.0.1"
    security_opt:
      - "apparmor=unconfined"
    ports:
      - "2222:22"
      - "8000:80"
      - "8001:8000"
    volumes:
      - ".:/src"
      - "../../:/am-packbuild"
