name: Archivematica DEB Packages Upgrade Test
on:
  workflow_dispatch:
    inputs:
      baseline_archivematica_packages_repo_version:
        description: "Archivematica packages repository version to install before the upgrade (e.g. 1.17.x)"
        required: false
        default: "1.17.x"
        type: "string"
      baseline_archivematica_packages_repo_baseurl:
        description: "Optional baseline Archivematica DEB repository base URL (version root; codename appended automatically)"
        required: false
        default: ""
        type: "string"
      baseline_elasticsearch_repo_version:
        description: "Elasticsearch repository version for the baseline install (e.g. 6.x)"
        required: false
        default: "6.x"
        type: "string"
      upgrade_archivematica_packages_repo_version:
        description: "Archivematica packages repository version to upgrade to (e.g. 1.18.x)"
        required: false
        default: "1.18.x"
        type: "string"
      upgrade_archivematica_packages_repo_baseurl:
        description: "Optional upgrade Archivematica DEB repository base URL (version root; codename appended automatically)"
        required: false
        default: ""
        type: "string"
      upgrade_elasticsearch_repo_version:
        description: "Elasticsearch repository version for the upgraded system (e.g. 8.x)"
        required: false
        default: "8.x"
        type: "string"
      build_packages:
        description: "Build local packages for the upgrade target"
        required: true
        default: true
        type: "boolean"
  pull_request:
    paths:
      - ".github/actions/setup-podman-test/**"
      - ".github/workflows/test-am-upgrade-debs.yml"
      - "debs/jammy/archivematica/**"
      - "debs/jammy/archivematica-storage-service/**"
      - "debs/noble/archivematica/**"
      - "debs/noble/archivematica-storage-service/**"
      - "tests/archivematica/**"
      - "!tests/archivematica/README.md"
      - "!tests/archivematica/EL9/**"
  push:
    branches:
      - "stable/**"
      - "qa/**"
    paths:
      - ".github/actions/setup-podman-test/**"
      - ".github/workflows/test-am-upgrade-debs.yml"
      - "debs/jammy/archivematica/**"
      - "debs/jammy/archivematica-storage-service/**"
      - "debs/noble/archivematica/**"
      - "debs/noble/archivematica-storage-service/**"
      - "tests/archivematica/**"
      - "!tests/archivematica/README.md"
      - "!tests/archivematica/EL9/**"
  schedule:
    - cron: "0 4 * * *"

env:
  BASELINE_ARCHIVEMATICA_PACKAGES_REPO_VERSION: ${{ inputs.baseline_archivematica_packages_repo_version || '1.17.x' }}
  BASELINE_ARCHIVEMATICA_PACKAGES_REPO_BASEURL: ${{ inputs.baseline_archivematica_packages_repo_baseurl || '' }}
  BASELINE_ELASTICSEARCH_PACKAGES_REPO_VERSION: ${{ inputs.baseline_elasticsearch_repo_version || '6.x' }}
  UPGRADE_ARCHIVEMATICA_PACKAGES_REPO_VERSION: ${{ inputs.upgrade_archivematica_packages_repo_version || '1.18.x' }}
  UPGRADE_ARCHIVEMATICA_PACKAGES_REPO_BASEURL: ${{ inputs.upgrade_archivematica_packages_repo_baseurl || '' }}
  UPGRADE_ELASTICSEARCH_PACKAGES_REPO_VERSION: ${{ inputs.upgrade_elasticsearch_repo_version || '8.x' }}

jobs:
  build-am-packages:
    name: Build Archivematica packages (${{ matrix.codename }})
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            startsWith(
              inputs.baseline_archivematica_packages_repo_version || '1.17.x',
              '1.17'
            ) &&
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"}]}' ||
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"},{"codename":"noble","ubuntu_version":"24.04"}]}'
          )
        }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica
    - name: Save artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: archivematica-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica/repo
  build-ss-packages:
    name: Build Storage Service packages (${{ matrix.codename }})
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            startsWith(
              inputs.baseline_archivematica_packages_repo_version || '1.17.x',
              '1.17'
            ) &&
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"}]}' ||
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"},{"codename":"noble","ubuntu_version":"24.04"}]}'
          )
        }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service
    - name: Save artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: archivematica-storage-service-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service/repo
  create-package-repo:
    name: Create package repository (${{ matrix.codename }})
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            startsWith(
              inputs.baseline_archivematica_packages_repo_version || '1.17.x',
              '1.17'
            ) &&
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"}]}' ||
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"},{"codename":"noble","ubuntu_version":"24.04"}]}'
          )
        }}
    needs:
    - build-am-packages
    - build-ss-packages
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Restore Archivematica packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: archivematica-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica/repo
    - name: Restore Storage Service packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: archivematica-storage-service-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service/repo
    - name: Create repository
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }} createrepo
    - name: Save package repository
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-repository-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/_deb_repository
  test-upgrade:
    name: Test upgrade path (${{ matrix.codename }})
    needs: create-package-repo
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: >-
        ${{
          fromJSON(
            startsWith(
              inputs.baseline_archivematica_packages_repo_version || '1.17.x',
              '1.17'
            ) &&
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"}]}' ||
            '{"include":[{"codename":"jammy","ubuntu_version":"22.04"},{"codename":"noble","ubuntu_version":"24.04"}]}'
          )
        }}
    if: >-
      ${{
        always() && (
          needs.create-package-repo.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_packages == false)
        )
      }}
    env:
      build_packages: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Restore package repository
      if: ${{ env.build_packages == 'true' && needs.create-package-repo.result == 'success' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-repository-${{ matrix.codename }}
        path: ${{ github.workspace }}/debs/${{ matrix.codename }}/_deb_repository
    - name: "Prepare Archivematica test environment"
      uses: ./.github/actions/setup-podman-test
      with:
        environment-label: "${{ matrix.codename }}-upgrade"
        image-name: "ubuntu"
        image-tag: "${{ matrix.ubuntu_version }}"
    - name: "Install baseline packages"
      timeout-minutes: 15
      working-directory: ${{ github.workspace }}/tests/archivematica
      run: |
        podman-compose exec \
          --env LOCAL_REPOSITORY="false" \
          --env ARCHIVEMATICA_PACKAGES_REPO_VERSION="${{ env.BASELINE_ARCHIVEMATICA_PACKAGES_REPO_VERSION }}" \
          --env ARCHIVEMATICA_PACKAGES_REPO_BASEURL="${{ env.BASELINE_ARCHIVEMATICA_PACKAGES_REPO_BASEURL }}" \
          --env ELASTICSEARCH_PACKAGES_REPO_VERSION="${{ env.BASELINE_ELASTICSEARCH_PACKAGES_REPO_VERSION }}" \
          --user ubuntu \
          archivematica \
          /am-packbuild/tests/archivematica/ubuntu/install.sh
    - name: "Get baseline Archivematica version"
      run: |
        curl \
          --silent \
          --dump-header - \
          --header 'Authorization: ApiKey admin:apikey' \
          --header 'Content-Type: application/json' \
          'http://localhost:8000/api/processing-configuration/' | grep X-Archivematica-Version
    - name: "Check baseline Archivematica APIs"
      run: |
        tests/archivematica/common/check-archivematica-apis
    - name: "Upgrade packages"
      timeout-minutes: 15
      working-directory: ${{ github.workspace }}/tests/archivematica
      run: |
        podman-compose exec \
          --env LOCAL_REPOSITORY="${{ env.build_packages }}" \
          --env ARCHIVEMATICA_PACKAGES_REPO_VERSION="${{ env.UPGRADE_ARCHIVEMATICA_PACKAGES_REPO_VERSION }}" \
          --env ARCHIVEMATICA_PACKAGES_REPO_BASEURL="${{ env.UPGRADE_ARCHIVEMATICA_PACKAGES_REPO_BASEURL }}" \
          --env ELASTICSEARCH_PACKAGES_REPO_VERSION="${{ env.UPGRADE_ELASTICSEARCH_PACKAGES_REPO_VERSION }}" \
          --env ELASTICSEARCH_MIGRATE_FROM_6X="${{ startsWith(env.BASELINE_ELASTICSEARCH_PACKAGES_REPO_VERSION, '6') }}" \
          --user ubuntu \
          archivematica \
          /am-packbuild/tests/archivematica/ubuntu/upgrade.sh
    - name: "Get upgraded Archivematica version"
      run: |
        curl \
          --silent \
          --dump-header - \
          --header 'Authorization: ApiKey admin:apikey' \
          --header 'Content-Type: application/json' \
          'http://localhost:8000/api/processing-configuration/' | grep X-Archivematica-Version
    - name: "Check upgraded Archivematica APIs"
      run: |
        tests/archivematica/common/check-archivematica-apis
    - name: "Save logs on failure"
      if: "${{ failure() || cancelled() }}"
      working-directory: "${{ github.workspace }}/tests/archivematica"
      run: |
        common/collect-test-logs logs archivematica
    - name: "Upload logs on failure"
      if: "${{ failure() || cancelled() }}"
      uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
      with:
        name: "logs-test-upgrade-${{ matrix.ubuntu_version }}"
        path: "${{ github.workspace }}/tests/archivematica/logs"
