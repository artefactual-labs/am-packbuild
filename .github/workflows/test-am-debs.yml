name: Archivematica DEB Packages Test
on:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system to test"
        default: "all"
        required: true
        type: "choice"
        options:
          - "all"
          - "jammy"
          - "noble"
      archivematica_packages_repo_version:
        description: "Archivematica packages repository version (e.g. 1.18.x)"
        required: false
        default: "1.18.x"
        type: "string"
      archivematica_packages_repo_baseurl:
        description: "Optional Archivematica DEB repository base URL (version root; codename appended automatically)"
        required: false
        default: ""
        type: "string"
      build_packages:
        description: "Build local packages"
        required: true
        default: true
        type: "boolean"
  pull_request:
    paths:
      - ".github/actions/setup-podman-test/**"
      - ".github/workflows/test-am-debs.yml"
      - "debs/jammy/archivematica/**"
      - "debs/jammy/archivematica-storage-service/**"
      - "debs/noble/archivematica/**"
      - "debs/noble/archivematica-storage-service/**"
      - "tests/archivematica/**"
      - "!tests/archivematica/README.md"
      - "!tests/archivematica/EL9/**"
  push:
    branches:
      - "stable/**"
      - "qa/**"
    paths:
      - ".github/actions/setup-podman-test/**"
      - ".github/workflows/test-am-debs.yml"
      - "debs/jammy/archivematica/**"
      - "debs/jammy/archivematica-storage-service/**"
      - "debs/noble/archivematica/**"
      - "debs/noble/archivematica-storage-service/**"
      - "tests/archivematica/**"
      - "!tests/archivematica/README.md"
      - "!tests/archivematica/EL9/**"
  schedule:
    - cron: "0 2 * * *"

env:
  ARCHIVEMATICA_PACKAGES_REPO_VERSION: ${{ inputs.archivematica_packages_repo_version || '1.18.x' }}
  ARCHIVEMATICA_PACKAGES_REPO_BASEURL: ${{ inputs.archivematica_packages_repo_baseurl || '' }}
jobs:
  select_matrix:
    name: Select DEB package test matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: "${{ steps.select.outputs.matrix }}"
      test_matrix: "${{ steps.select.outputs.test_matrix }}"
    steps:
    - name: Select matrix
      id: select
      env:
        SELECTED_OS: "${{ inputs.os }}"
      run: |
        selected_os=${SELECTED_OS:-all}
        matrix=$(
          jq --compact-output --null-input \
            --arg selected_os "$selected_os" \
            '{
              include: (
                [
                  {
                    codename: "jammy",
                    ubuntu_version: "22.04"
                  },
                  {
                    codename: "noble",
                    ubuntu_version: "24.04"
                  }
                ]
                | if $selected_os == "all"
                  then .
                  else map(select(.codename == $selected_os))
                  end
              )
            }'
        )
        if [[ $(jq '.include | length' <<< "$matrix") -eq 0 ]]; then
          echo "Unknown operating system: ${selected_os}" >&2
          exit 1
        fi
        test_matrix=$(
          jq --compact-output \
            '{
              include: (
                (.include | map(. + {
                  label: .codename,
                  search_enabled: "true"
                }))
                + (
                  .include
                  | map(
                      select(.codename == "jammy")
                      | . + {
                          label: "jammy-search-disabled",
                          search_enabled: "false"
                        }
                    )
                )
              )
            }' <<< "$matrix"
        )
        echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
        echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"
  build-am-packages:
    name: Build Archivematica packages (${{ matrix.codename }})
    runs-on: ubuntu-latest
    needs: select_matrix
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select_matrix.outputs.matrix) }}"
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica
    - name: Save artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: archivematica-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica/repo
  build-ss-packages:
    name: Build Storage Service packages (${{ matrix.codename }})
    runs-on: ubuntu-latest
    needs: select_matrix
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select_matrix.outputs.matrix) }}"
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service
    - name: Save artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: archivematica-storage-service-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service/repo
  create-package-repo:
    name: Create package repository (${{ matrix.codename }})
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select_matrix.outputs.matrix) }}"
    needs:
    - select_matrix
    - build-am-packages
    - build-ss-packages
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Restore Archivematica packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: archivematica-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica/repo
    - name: Restore Storage Service packages
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: archivematica-storage-service-packages-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/archivematica-storage-service/repo
    - name: Create repository
      run: |
        make -C ${{ github.workspace }}/debs/${{ matrix.codename }} createrepo
    - name: Save package repository
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: package-repository-${{ matrix.codename }}
        path: |
          ${{ github.workspace }}/debs/${{ matrix.codename }}/_deb_repository
  test:
    name: Test packages (${{ matrix.label }})
    needs:
    - select_matrix
    - create-package-repo
    runs-on: ubuntu-24.04
    # Allow noble runs to be non-blocking when testing 1.17.x (no Ubuntu 24.04 packages exist).
    continue-on-error: ${{ matrix.codename == 'noble' && startsWith(inputs.archivematica_packages_repo_version || '1.18.x', '1.17') }}
    strategy:
      fail-fast: false
      matrix: "${{ fromJSON(needs.select_matrix.outputs.test_matrix) }}"
    if: >-
      ${{
        always() && (
          needs.create-package-repo.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.build_packages == false)
        )
      }}
    env:
      build_packages: "${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_packages) }}"
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Restore package repository
      if: ${{ env.build_packages == 'true' && needs.create-package-repo.result == 'success' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: package-repository-${{ matrix.codename }}
        path: ${{ github.workspace }}/debs/${{ matrix.codename }}/_deb_repository
    - name: "Prepare Archivematica test environment"
      uses: ./.github/actions/setup-podman-test
      with:
        environment-label: "${{ matrix.label }}"
        image-name: "ubuntu"
        image-tag: "${{ matrix.ubuntu_version }}"
    - name: Install packages
      timeout-minutes: 15
      working-directory: ${{ github.workspace }}/tests/archivematica
      run: |
        podman-compose exec \
          --env LOCAL_REPOSITORY="${{ env.build_packages }}" \
          --env ARCHIVEMATICA_PACKAGES_REPO_VERSION="${{ env.ARCHIVEMATICA_PACKAGES_REPO_VERSION }}" \
          --env ARCHIVEMATICA_PACKAGES_REPO_BASEURL="${{ env.ARCHIVEMATICA_PACKAGES_REPO_BASEURL }}" \
          --env SEARCH_ENABLED="${{ matrix.search_enabled }}" \
          --user ubuntu \
          archivematica \
          /am-packbuild/tests/archivematica/ubuntu/install.sh
    - name: "Verify search-disabled service environments"
      if: ${{ matrix.search_enabled == 'false' }}
      working-directory: ${{ github.workspace }}/tests/archivematica
      run: |
        podman-compose exec --user root archivematica bash -c '
          set -euo pipefail
          services=(
            archivematica-dashboard
            archivematica-mcp-server
            archivematica-mcp-client
          )
          variables=(
            ARCHIVEMATICA_DASHBOARD_DASHBOARD_SEARCH_ENABLED=false
            ARCHIVEMATICA_MCPSERVER_MCPSERVER_SEARCH_ENABLED=false
            ARCHIVEMATICA_MCPCLIENT_MCPCLIENT_SEARCH_ENABLED=false
          )
          for index in "${!services[@]}"; do
            service_user=$(systemctl show \
              --property User \
              --value \
              "${services[$index]}")
            pid=$(systemctl show \
              --property MainPID \
              --value \
              "${services[$index]}")
            test -n "${service_user}"
            test "${pid}" -gt 0
            sudo --user "${service_user}" \
              cat "/proc/${pid}/environ" |
              tr "\0" "\n" |
              grep --fixed-strings --line-regexp "${variables[$index]}"
          done
          ! systemctl is-active --quiet elasticsearch
        '
    - name: "Check Archivematica APIs"
      run: |
        tests/archivematica/common/check-archivematica-apis
    - name: "Save logs on failure"
      if: "${{ failure() || cancelled() }}"
      working-directory: "${{ github.workspace }}/tests/archivematica"
      run: |
        common/collect-test-logs logs archivematica
    - name: "Upload logs on failure"
      if: "${{ failure() || cancelled() }}"
      uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
      with:
        name: "logs-test-${{ matrix.label }}"
        path: "${{ github.workspace }}/tests/archivematica/logs"
